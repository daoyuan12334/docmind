# DocMind 前端 Nginx 站点配置（容器内 /etc/nginx/conf.d/docmind.conf）
# 关键：SSE 流式回答必须关掉 proxy_buffering，否则 token 会被缓冲成一次性返回。

upstream docmind_backend {
    server backend:8080 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 产物带 hash，静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    # ---- 反向代理后端 ----
    location /api/ {
        proxy_pass http://docmind_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        # 大文件上传（扫描件/视频）
        client_max_body_size 220m;
    }

    # ---- SSE：聊天流式输出 ----
    location /api/chat/ {
        proxy_pass http://docmind_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        gzip off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header X-Accel-Buffering no;
    }

    # ---- MCP 端点（供外部 Agent 调用）----
    location /mcp/ {
        proxy_pass http://docmind_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # ---- SPA 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/docmind.access.log;
    error_log  /var/log/nginx/docmind.error.log warn;
}
