# DocMind Prometheus 抓取配置
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    project: docmind

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # ---- Spring Boot Actuator / Micrometer ----
  - job_name: docmind-backend
    metrics_path: /actuator/prometheus
    scheme: http
    follow_redirects: true
    static_configs:
      - targets: ["backend:9091"]
        labels:
          application: docmind
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
    # 拉取超时放宽：指标里含 Hikari/Kafka/AI 直方图
    scrape_timeout: 8s

  # ---- Prometheus 自监控 ----
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ---- 基础设施（需要先在宿主机部署 exporter；默认注释，避免启动即报 target down）----
