server:
  port: ${DOCMIND_SERVER_PORT:8080}
  address: ${DOCMIND_SERVER_ADDRESS:0.0.0.0}
  shutdown: graceful
  tomcat:
    threads:
      max: 120
    max-http-form-post-size: 200MB

spring:
  application:
    name: docmind
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 220MB
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  threads:
    virtual:
      enabled: true

  ai:
    openai:
      # 阿里云百炼 OpenAI 兼容端点。注意：Spring AI 2.0 使用官方 openai-java SDK，
      # base-url 必须自带 /v1，SDK 只再拼 /chat/completions、/embeddings 等相对路径。
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}/v1
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${AI_CHAT_MODEL:qwen-plus}
          temperature: 0.3
          max-tokens: 2048
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-v4}
          dimensions: 1024
    mcp:
      server:
        name: docmind-mcp-server
        version: 1.0.0
        type: SYNC
        # STREAMABLE = MCP 2025-06-18 Streamable HTTP 传输（Cursor / Claude Desktop 推荐）
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
          keep-alive-interval: 30s
        instructions: "DocMind 私有文档知识库 MCP 服务：可检索企业知识库、读取文档摘要。"
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
      client:
        enabled: false
        name: docmind-mcp-client
        type: SYNC
        request-timeout: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,threaddump,loggers
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  # Spring Data Redis 自带的健康指示器靠解析 INFO 输出实现（内部走 Properties.load()）。
  # Windows 版 Redis 的 INFO server 会返回 executable:c:\users\...\redis-server.exe，
  # 其中的 \u 被当成 Unicode 转义，抛 "Malformed \uxxxx encoding."，
  # 结果连接正常却被判 DOWN，进而让 /actuator/health 整体 503。
  # 统一关掉它，改用 observe.CacheHealthIndicator（走 CachePort.ping()，真发 PING 命令）。
  health:
    redis:
      enabled: false
  metrics:
    tags:
      application: docmind
    distribution:
      percentiles-histogram:
        ai.chat.duration: true
        http.server.requests: true
  observations:
    key-values:
      service: docmind
  tracing:
    sampling:
      probability: ${OTEL_SAMPLE_RATE:1.0}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.docmind: ${LOG_LEVEL:INFO}
    org.springframework.ai: INFO

docmind:
  ai:
    base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
    api-key: ${DASHSCOPE_API_KEY:}
    chat-model: ${AI_CHAT_MODEL:qwen-plus}
    embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-v4}
    embedding-dimensions: ${AI_EMBEDDING_DIM:1024}
  jwt:
    secret: ${JWT_SECRET:docmind-dev-secret-key-please-change-in-production-0123456789}
    expire-minutes: ${JWT_EXPIRE_MINUTES:720}
  rag:
    top-k: 6
    candidate-k: 30
    vector-weight: 0.65
    keyword-weight: 0.35
    min-score: 0.15
    rerank-enabled: true
    max-context-chars: 8000
  ingest:
    chunk-size: 800
    chunk-overlap: 120
    max-attempts: 3
    worker-concurrency: 2
  multimodal:
    vision-model: ${AI_VISION_MODEL:qwen3-vl-plus}
    omni-model: ${AI_OMNI_MODEL:qwen3-omni-flash}
    ocr-enabled: true
    vision-max-pages: 20
    video-frame-interval-seconds: 5
    video-max-frames: 12
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
  quota:
    daily-tokens-per-user: ${DAILY_TOKEN_QUOTA:200000}
    requests-per-minute: ${RPM_LIMIT:30}
  mcp:
    expose-kb-ids: ${DOCMIND_MCP_EXPOSE_KB_IDS:}
    api-key: ${DOCMIND_MCP_API_KEY:}
