# ===== 生产 profile：PostgreSQL(pgvector) + Redis + Kafka + MinIO =====
# 通过环境变量覆盖连接信息，配合 docker-compose 使用。
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:docmind}
    username: ${DB_USER:docmind}
    password: ${DB_PASSWORD:docmind_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 16
      minimum-idle: 4
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 60000
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/postgres
    baseline-on-migrate: true
    validate-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        linger.ms: 20
    consumer:
      group-id: docmind-ingest
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 1
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
      concurrency: 2

  ai:
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: ${AI_EMBEDDING_DIM:1024}
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        remove-existing-vector-store-table: false
        table-name: vector_store

docmind:
  storage:
    type: minio
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:docmind}
  cache:
    type: redis
  bus:
    type: kafka
  vector:
    type: pgvector
  search:
    type: pg

logging:
  level:
    com.docmind: INFO
    org.apache.kafka: WARN

# 生产环境把 Actuator 挪到独立端口，只在 docker 内网暴露（compose 不映射到宿主）。
# 这样 Prometheus 能免鉴权抓取 /actuator/prometheus，而公网完全摸不到它。
management:
  server:
    port: ${MANAGEMENT_PORT:9091}
    address: 0.0.0.0
