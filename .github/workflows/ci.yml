name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 日常构建只跑 *Test（surefire 默认不收 *IT），所以不需要真实 Redis / Kafka。
      # 需要真中间件的联调用 ./tool/verify-middleware.sh 单独触发。
      - name: Run unit tests
        working-directory: ./backend
        run: mvn -B -ntp test

      - name: Package
        working-directory: ./backend
        run: mvn -B -ntp package -DskipTests

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: docmind-backend-jar
          path: backend/target/*.jar
          retention-days: 7

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: docmind-frontend-dist
          path: frontend/dist
          retention-days: 7

  compose:
    name: Compose descriptors check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate docker-compose.yml
        run: python tool/check_compose.py

      - name: Self-test the validator
        run: python tool/check_compose_selftest.py

      - name: Validate compose with docker compose config
        run: docker compose --env-file .env.example config -q
        continue-on-error: true
